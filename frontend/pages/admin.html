<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel Admin | SkitCream</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/admin.css" />
  </head>
  <body>
    <div class="admin-layout">
      <!-- SIDEBAR -->
      <aside class="admin-sidebar">
        <div class="admin-logo">
          <img src="../assets/images/logo/skit.jpg" alt="SkitCream" />
          <span>Admin</span>
        </div>
        <nav class="admin-nav">
          <a
            href="#productos"
            class="admin-nav-item active"
            onclick="mostrarSeccion('productos')"
          >
            <i class="fa-solid fa-box"></i> Productos
          </a>
          <a
            href="#usuarios"
            class="admin-nav-item"
            onclick="mostrarSeccion('usuarios')"
          >
            <i class="fa-solid fa-users"></i> Usuarios
          </a>
          <a
            href="#pedidos"
            class="admin-nav-item"
            onclick="mostrarSeccion('pedidos')"
          >
            <i class="fa-solid fa-bag-shopping"></i> Pedidos
          </a>
          <a
            href="#categorias"
            class="admin-nav-item"
            onclick="mostrarSeccion('categorias')"
          >
            <i class="fa-solid fa-tags"></i> Categorías
          </a>

          <a href="../index.html" class="admin-nav-item admin-salir">
            <i class="fa-solid fa-right-from-bracket"></i> Salir
          </a>
        </nav>
      </aside>

      <!-- CONTENIDO -->
      <main class="admin-contenido">
        <!-- SECCIÓN PRODUCTOS -->
        <section id="productos" class="admin-seccion activa">
          <div class="admin-header">
            <h1>Productos</h1>
            <button class="btn-admin" onclick="mostrarFormProducto()">
              <i class="fa-solid fa-plus"></i> Agregar producto
            </button>
          </div>

          <!-- Formulario agregar/editar producto -->
          <div id="formProducto" class="admin-form" style="display: none">
            <h3 id="formProductoTitulo">Agregar producto</h3>
            <input type="hidden" id="productoId" />
            <label>Nombre</label>
            <input
              type="text"
              id="productoNombre"
              placeholder="Nombre del producto"
            />
            <label>Descripción</label>
            <input
              type="text"
              id="productoDescripcion"
              placeholder="Descripción"
            />
            <label>Precio</label>
            <input type="number" id="productoPrecio" placeholder="Precio" />
            <label>Categoría</label>
            <select id="productoCategoria">
              <option value="Tortas">Tortas</option>
              <option value="Fresas">Fresas con crema</option>
              <option value="Postres">Postres</option>
              <option value="Cafes">Cafés</option>
              <option value="Bebidas">Bebidas</option>
            </select>
            <label>Imagen (nombre del archivo)</label>
            <input
              type="text"
              id="productoImagen"
              placeholder="Ej: red-velvet.jpg"
            />
            <div class="admin-form-botones">
              <button class="btn-admin" onclick="guardarProducto()">
                Guardar
              </button>
              <button
                class="btn-admin btn-cancelar"
                onclick="cancelarFormProducto()"
              >
                Cancelar
              </button>
            </div>
          </div>

          <div id="tablaProductos"></div>
        </section>

        <!-- SECCIÓN USUARIOS -->
        <section id="usuarios" class="admin-seccion">
          <div class="admin-header">
            <h1>Usuarios</h1>
          </div>
          <div id="tablaUsuarios"></div>
        </section>

        <!-- SECCIÓN PEDIDOS -->
        <section id="pedidos" class="admin-seccion">
          <div class="admin-header">
            <h1>Pedidos</h1>
          </div>
          <div id="tablaPedidos"></div>
        </section>
        <!-- SECCIÓN CATEGORÍAS -->
        <section id="categorias" class="admin-seccion">
          <div class="admin-header">
            <h1>Categorías</h1>
            <button class="btn-admin" onclick="mostrarFormCategoria()">
              <i class="fa-solid fa-plus"></i> Agregar categoría
            </button>
          </div>

          <div id="formCategoria" class="admin-form" style="display: none">
            <h3 id="formCategoriaTitulo">Agregar categoría</h3>
            <input type="hidden" id="categoriaId" />
            <label>Nombre</label>
            <input
              type="text"
              id="categoriaNombre"
              placeholder="Nombre de la categoría"
            />
            <label>Descripción</label>
            <input
              type="text"
              id="categoriaDescripcion"
              placeholder="Descripción opcional"
            />
            <div class="admin-form-botones">
              <button class="btn-admin" onclick="guardarCategoria()">
                Guardar
              </button>
              <button
                class="btn-admin btn-cancelar"
                onclick="cancelarFormCategoria()"
              >
                Cancelar
              </button>
            </div>
          </div>

          <div id="tablaCategorias"></div>
        </section>
      </main>
    </div>

    <script src="../js/admin.js"></script>
  </body>
</html>
